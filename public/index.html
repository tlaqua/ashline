<head>

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23070708'/><path d='M6 24L16 6l10 18h-5l-5-9-5 9z' fill='%23f2f2f5'/></svg>" />
  <script src="/planck.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: #070708; color: #f2f2f5;
      font-family: 'Impact', 'Arial Narrow', 'Segoe UI', sans-serif;
    }
    canvas { display: block; width: 100vw; height: 100vh; }
    #hud {
      position: fixed; top: 20px; left: 24px; right: 24px;
      display: flex; justify-content: space-between; align-items: flex-start;
      pointer-events: none; z-index: 10;
    }
    .panel {
      background: rgba(10, 10, 12, 0.85);
      border-left: 4px solid #f2f2f5;
      padding: 10px 18px;
      transform: skewX(-10deg);
      box-shadow: 6px 6px 0 rgba(255, 255, 255, 0.08);
    }
    .panel-inner { transform: skewX(10deg); }
    .title {
      font-size: 22px; letter-spacing: 3px; font-weight: 900;
      text-transform: uppercase; color: #f2f2f5; min-width: 265px;
    }
    .track-pills {
      display: flex; gap: 4px; flex-wrap: wrap;
      margin-top: 6px; pointer-events: auto; max-width: 440px;
    }
    .track-btn {
      background: #141418; color: #8f8f96; border: 1px solid #3a3a42;
      font-family: monospace; font-size: 11px; font-weight: 700;
      padding: 2px 6px; cursor: pointer; transition: background 0.1s, color 0.1s;
    }
    .track-btn:hover { color: #f2f2f5; border-color: #7c7c85; }
    .track-btn.active { background: #f2f2f5; color: #070708; border-color: #f2f2f5; }
    .sub {
      font-family: monospace; font-size: 11px; letter-spacing: 1.5px;
      color: #8f8f96; margin-top: 6px;
    }
    .stats { display: flex; gap: 22px; align-items: baseline; }
    .stat-time { width: 132px; }
    .stat-faults { width: 58px; }
    .stat-speed { width: 66px; }
    .stat-label {
      font-family: monospace; font-size: 10px; color: #7a7a82;
      letter-spacing: 2px; display: block;
    }
    .stat-val {
      font-family: 'Courier New', Consolas, monospace;
      font-size: 24px; font-weight: 900; letter-spacing: 0.5px;
      font-variant-numeric: tabular-nums; display: inline-block;
    }
    #banner {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      pointer-events: none; opacity: 0; transition: opacity 0.12s ease; z-index: 20;
    }
    #banner.visible { opacity: 1; }
    .banner-box {
      background: #09090b; border-top: 3px solid #f2f2f5; border-bottom: 3px solid #f2f2f5;
      padding: 22px 56px; text-align: center; transform: skewX(-10deg);
      box-shadow: 0 20px 60px rgba(0,0,0,0.9);
    }
    .banner-box > div { transform: skewX(10deg); }
    .banner-main { font-size: 46px; letter-spacing: 6px; font-weight: 900; }
    .banner-sub {
      font-family: monospace; font-size: 13px; letter-spacing: 2px;
      color: #b0b0b8; margin-top: 8px;
    }
    #controls-hint {
      position: fixed; bottom: 18px; left: 24px;
      font-family: monospace; font-size: 11px; letter-spacing: 1.2px;
      color: #7c7c85; pointer-events: none;
      background: rgba(7,7,8,0.72); padding: 6px 12px; border-left: 2px solid #55555c;
    }
    b { color: #e5e5ea; }
  </style>

  // ============================================================================
  // MULTIPLAYER GHOSTS
  // ============================================================================
  const ghosts = new Map();
  let ws = null, onlineCount = 1, lastSendTime = 0, lastSentX = 0, lastSentY = 0, lastSentAng = 0, lastSentTrack = -1;
  const txBuffer = new Float32Array(13);

  function connectMultiplayer() {
    if (!CONFIG.multiplayer.enabled || location.protocol === 'file:') {
      uiNet.textContent = 'SOLO MODE // LOCAL FILE'; return;
    }
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const room = new URLSearchParams(location.search).get('room') || 'lab-main';
    const url = `${proto}//${location.host}/ws${room ? `?room=${encodeURIComponent(room)}` : ''}`;
    try { ws = new WebSocket(url); ws.binaryType = 'arraybuffer'; }
    catch { uiNet.textContent = 'SOLO MODE // OFFLINE'; return; }

    ws.onopen = () => { uiNet.textContent = `ROOM: ${room.toUpperCase()} // CONNECTED`; };
    ws.onmessage = (event) => {
      if (typeof event.data === 'string') {
        try {
          const msg = JSON.parse(event.data);
          if (msg.type === 'welcome' || msg.type === 'count') {
            onlineCount = msg.count || 1;
            uiNet.textContent = `ROOM: ${room.toUpperCase()} // ${onlineCount} RIDERS LIVE`;
          } else if (msg.type === 'leave') {
            ghosts.delete(msg.id);
            onlineCount = msg.count || 1;
            uiNet.textContent = `ROOM: ${room.toUpperCase()} // ${onlineCount} RIDERS LIVE`;
          }
        } catch {}
        return;
      }
      if (event.data instanceof ArrayBuffer && event.data.byteLength === 56) {
        const dv = new DataView(event.data);
        const id = dv.getUint16(0, true), hue = dv.getUint16(2, true);
        const pose = new Float32Array(event.data, 4, 13);
        const now = performance.now();
        const flags = Math.round(pose[12]), isCrashed = (flags & 1) !== 0, trackIdx = flags >> 2;
        let g = ghosts.get(id);
        if (!g) {
          g = { id, hue, trackIdx, cur: new Float32Array(pose), target: new Float32Array(pose), trail: [], wasCrashed: isCrashed, lastSeen: now };
          ghosts.set(id, g);
        } else {
          const jumpDist = Math.hypot(pose[0] - g.cur[0], pose[1] - g.cur[1]);
          const switched = g.trackIdx !== trackIdx;
          g.hue = hue; g.trackIdx = trackIdx; g.target.set(pose); g.lastSeen = now;
          if (switched || jumpDist > CONFIG.multiplayer.snapDistance) { g.cur.set(pose); g.trail.length = 0; }
        }
        if (isCrashed && !g.wasCrashed && g.trackIdx === currentTrackIdx) spawnTechnicolorBurst({ x: pose[9], y: pose[10] }, hue);
        g.wasCrashed = isCrashed;
      }
    };
    ws.onclose = () => {
      uiNet.textContent = 'DISCONNECTED // RECONNECTING...';
      ghosts.clear();
      setTimeout(connectMultiplayer, 2500);
    };
  }

  function sendLocalPose(now) {
    if (!ws || ws.readyState !== WebSocket.OPEN || !chassis) return;
    if (now - lastSendTime < 1000 / CONFIG.multiplayer.sendHz && lastSentTrack === currentTrackIdx) return;
    const cp = chassis.getPosition(), ca = chassis.getAngle();
    const moved = Math.abs(cp.x - lastSentX) + Math.abs(cp.y - lastSentY) + Math.abs(ca - lastSentAng);
    if (moved < 0.004 && lastSentTrack === currentTrackIdx && now - lastSendTime < CONFIG.multiplayer.idleSendMs) return;
    const rw = rearWheel.getPosition(), fw = frontWheel.getPosition(), rd = riderBody.getPosition();
    txBuffer[0] = cp.x; txBuffer[1] = cp.y; txBuffer[2] = ca;
    txBuffer[3] = rw.x; txBuffer[4] = rw.y; txBuffer[5] = rearWheel.getAngle();
    txBuffer[6] = fw.x; txBuffer[7] = fw.y; txBuffer[8] = frontWheel.getAngle();
    txBuffer[9] = rd.x; txBuffer[10] = rd.y; txBuffer[11] = riderBody.getAngle();
    txBuffer[12] = (crashed ? 1 : 0) | (finished ? 2 : 0) | (currentTrackIdx << 2);
    try { ws.send(txBuffer.buffer); lastSendTime = now; lastSentX = cp.x; lastSentY = cp.y; lastSentAng = ca; lastSentTrack = currentTrackIdx; } catch {}
  }

  function normVec(v) { const len = Math.hypot(v.x, v.y) || 1; return pl.Vec2(v.x / len, v.y / len); }

  function buildWorld(cp) {
    world = new pl.World({ gravity: pl.Vec2(0, CONFIG.physics.gravityY) });
    rearContacts = 0; frontContacts = 0; crashed = false; pendingCrash = false; finished = false;
    pendingBounce = null; unpinchTimer = 0; banner.classList.remove('visible');
    crates = []; drums = []; seesaws = []; movers = []; spinners = []; pendulums = []; crumbles = [];
    bouncePads = []; boostPads = [];
    bounceByFixture.clear(); boostByFixture.clear(); crumbleByFixture.clear(); activeBoostCounts.clear();

    const terrainBody = world.createBody();
    terrainBody.createFixture(new pl.Chain(activeTrack.verts.map(([x, y]) => pl.Vec2(x, y)), false), {
      friction: CONFIG.physics.terrainFriction, restitution: CONFIG.physics.terrainRestitution
    }).setUserData('terrain');

    for (const hz of (activeTrack.hazards || [])) {
      const hb = world.createBody({ position: pl.Vec2((hz.x0 + hz.x1) * 0.5, hz.y + 0.10) });
      hb.createFixture(new pl.Box((hz.x1 - hz.x0) * 0.5, 0.14), { friction: 0.9 }).setUserData('hazard');
    }

    for (const ob of activeTrack.obstacles) {
      if (ob.type === 'pipe' || ob.type === 'box') {
        const b = world.createBody({ position: pl.Vec2(ob.x, ob.y), angle: ob.angle || 0 });
        b.createFixture(ob.type === 'pipe' ? new pl.Circle(ob.r) : new pl.Box(ob.w / 2, ob.h / 2), {
          friction: CONFIG.physics.obstacleFriction, restitution: CONFIG.physics.obstacleRestitution
        }).setUserData('terrain');
      } else if (ob.type === 'crate') {
        const b = world.createDynamicBody({ position: pl.Vec2(ob.x, ob.y), angle: ob.angle || 0, linearDamping: 0.15, angularDamping: 0.4 });
        b.createFixture(new pl.Box(ob.w / 2, ob.h / 2), { density: CONFIG.physics.crateDensity, friction: CONFIG.physics.crateFriction, restitution: 0.08 }).setUserData('prop');
        crates.push({ body: b, w: ob.w, h: ob.h });
      } else if (ob.type === 'drum') {
        const b = world.createDynamicBody({ position: pl.Vec2(ob.x, ob.y), linearDamping: 0.1, angularDamping: 0.35 });
        b.createFixture(new pl.Circle(ob.r), { density: CONFIG.physics.drumDensity, friction: CONFIG.physics.drumFriction, restitution: 0.12 }).setUserData('prop');
        drums.push({ body: b, r: ob.r });
      } else if (ob.type === 'seesaw') {
        const anchor = world.createBody({ position: pl.Vec2(ob.x, ob.y) });
        const beam = world.createDynamicBody({ position: pl.Vec2(ob.x, ob.y), angularDamping: 2.2 });
        beam.createFixture(new pl.Box(ob.w / 2, ob.h / 2), { density: CONFIG.physics.seesawDensity, friction: 1.55 }).setUserData('terrain');
        world.createJoint(new pl.RevoluteJoint({ enableLimit: true, lowerAngle: -(ob.maxAngle || 0.34), upperAngle: (ob.maxAngle || 0.34) }, anchor, beam, pl.Vec2(ob.x, ob.y)));
        seesaws.push({ body: beam, x: ob.x, y: ob.y, w: ob.w, h: ob.h });
      } else if (ob.type === 'mover') {
        const th0 = simTime * ob.speed + (ob.phase || 0);
        const b = world.createKinematicBody({ position: pl.Vec2(ob.x + (ob.ampX || 0) * Math.sin(th0), ob.y + (ob.ampY || 0) * Math.sin(th0)) });
        b.createFixture(new pl.Box(ob.w / 2, ob.h / 2), { friction: 1.65 }).setUserData('terrain');
        movers.push({ body: b, cfg: ob });
      } else if (ob.type === 'pendulum') {
        const th0 = ob.amp * Math.sin(simTime * ob.speed + (ob.phase || 0));
        const b = world.createKinematicBody({ position: pl.Vec2(ob.x + ob.len * Math.sin(th0), ob.y - ob.len * Math.cos(th0)), angle: th0 });
        b.createFixture(new pl.Circle(ob.r), { friction: 1.0, restitution: 0.25 }).setUserData('terrain');
        pendulums.push({ body: b, cfg: ob });
      } else if (ob.type === 'crumble') {
        const b = world.createKinematicBody({ position: pl.Vec2(ob.x, ob.y) });
        const f = b.createFixture(new pl.Box(ob.w / 2, ob.h / 2), { friction: 1.55 });
        f.setUserData('terrain');
        const cObj = { body: b, x: ob.x, y: ob.y, w: ob.w, h: ob.h, delay: ob.delay || CONFIG.physics.crumbleDelay, state: 'idle', timer: 0, vy: 0 };
        crumbles.push(cObj); crumbleByFixture.set(f, cObj);
      } else if (ob.type === 'spinner') {
        const hub = world.createBody({ position: pl.Vec2(ob.x, ob.y) });
        const wheel = world.createDynamicBody({ position: pl.Vec2(ob.x, ob.y) });
        wheel.createFixture(new pl.Box(ob.r, 0.20), { density: 5.0, friction: 1.5 }).setUserData('terrain');
        wheel.createFixture(new pl.Box(0.20, ob.r), { density: 5.0, friction: 1.5 }).setUserData('terrain');
        world.createJoint(new pl.RevoluteJoint({ enableMotor: true, motorSpeed: ob.speed, maxMotorTorque: CONFIG.physics.spinnerTorque }, hub, wheel, pl.Vec2(ob.x, ob.y)));
        spinners.push({ body: wheel, x: ob.x, y: ob.y, r: ob.r });
      } else if (ob.type === 'bounce') {
        const b = world.createBody({ position: pl.Vec2(ob.x, ob.y), angle: ob.angle || 0 });
        const f = b.createFixture(new pl.Box(ob.w / 2, ob.h / 2), { friction: 0.6, restitution: 0.2 });
        f.setUserData('bounce');
        const pad = { ...ob, lastHit: -10, flash: 0 };
        bouncePads.push(pad); bounceByFixture.set(f, pad);
      } else if (ob.type === 'boost') {
        const b = world.createBody({ position: pl.Vec2(ob.x, ob.y), angle: ob.angle || 0 });
        const f = b.createFixture(new pl.Box(ob.w / 2, ob.h / 2), { friction: 1.5 });
        f.setUserData('boost');
        boostPads.push(ob); boostByFixture.set(f, ob); activeBoostCounts.set(ob, 0);
      }
    }

    const sx = cp.x, sy = cp.groundY + 1.45;
    chassis = world.createDynamicBody({ position: pl.Vec2(sx, sy), angularDamping: CONFIG.bike.chassisAngularDamping, linearDamping: CONFIG.bike.chassisLinearDamping });
    chassis.createFixture(new pl.Polygon([pl.Vec2(-0.46,-0.05),pl.Vec2(0.36,-0.04),pl.Vec2(0.42,0.34),pl.Vec2(-0.42,0.28)]), {
      density: CONFIG.bike.chassisDensity, friction: CONFIG.bike.chassisFriction, restitution: CONFIG.bike.chassisRestitution, filterGroupIndex: -1
    }).setUserData('chassis');

    const wOpts = { density: CONFIG.bike.wheelDensity, friction: CONFIG.bike.wheelFriction, restitution: CONFIG.bike.wheelRestitution, filterGroupIndex: -1 };
    rearRestLocal = pl.Vec2(CONFIG.bike.rearWheelOffset.x, CONFIG.bike.rearWheelOffset.y);
    frontRestLocal = pl.Vec2(CONFIG.bike.frontWheelOffset.x, CONFIG.bike.frontWheelOffset.y);

    rearWheel = world.createDynamicBody({ position: pl.Vec2(sx + rearRestLocal.x, sy + rearRestLocal.y), angularDamping: CONFIG.bike.wheelAngularDamping });
    rearWheel.createFixture(new pl.Circle(CONFIG.bike.wheelRadius), wOpts).setUserData('rearWheel');

    frontWheel = world.createDynamicBody({ position: pl.Vec2(sx + frontRestLocal.x, sy + frontRestLocal.y), angularDamping: CONFIG.bike.wheelAngularDamping });
    frontWheel.createFixture(new pl.Circle(CONFIG.bike.wheelRadius), wOpts).setUserData('frontWheel');

    rearJoint = world.createJoint(new pl.WheelJoint({ motorSpeed: 0, maxMotorTorque: CONFIG.drivetrain.gasMaxTorque, enableMotor: true, frequencyHz: CONFIG.suspension.rearHz, dampingRatio: CONFIG.suspension.rearDamping }, chassis, rearWheel, rearWheel.getPosition(), rearAxisUnit));
    frontJoint = world.createJoint(new pl.WheelJoint({ motorSpeed: 0, maxMotorTorque: 0, enableMotor: true, frequencyHz: CONFIG.suspension.frontHz, dampingRatio: CONFIG.suspension.frontDamping }, chassis, frontWheel, frontWheel.getPosition(), frontAxisUnit));

    riderBody = world.createDynamicBody({ position: pl.Vec2(sx + CONFIG.rider.offset.x, sy + CONFIG.rider.offset.y), angularDamping: CONFIG.rider.angularDamping });
    riderBody.createFixture(new pl.Box(0.16, 0.34), { density: CONFIG.rider.torsoDensity, friction: 0.4, filterGroupIndex: -1 }).setUserData('fatal');
    riderBody.createFixture(new pl.Circle(pl.Vec2(0.06, 0.48), 0.21), { density: CONFIG.rider.headDensity, friction: 0.5, restitution: CONFIG.rider.headRestitution, filterGroupIndex: -1 }).setUserData('fatal');

    riderJoint = world.createJoint(new pl.RevoluteJoint({
      lowerAngle: -CONFIG.rider.maxJointAngleRad, upperAngle: CONFIG.rider.maxJointAngleRad,
      enableLimit: true, enableMotor: true, maxMotorTorque: CONFIG.rider.jointMaxTorque, motorSpeed: 0
    }, chassis, riderBody, pl.Vec2(sx + CONFIG.rider.jointOffset.x, sy + CONFIG.rider.jointOffset.y)));

    const isBikePart = (u) => u === 'rearWheel' || u === 'frontWheel' || u === 'chassis' || u === 'fatal';
    const isRideSurface = (u) => u === 'terrain' || u === 'prop' || u === 'boost' || u === 'bounce';

    world.on('begin-contact', (contact) => {
      const fA = contact.getFixtureA(), fB = contact.getFixtureB();
      const uA = fA.getUserData(), uB = fB.getUserData();
      if ((uA === 'fatal' && uB === 'terrain') || (uB === 'fatal' && uA === 'terrain')) { if (!crashed && !finished) pendingCrash = true; }
      if ((uA === 'hazard' && isBikePart(uB)) || (uB === 'hazard' && isBikePart(uA))) { if (!crashed && !finished) pendingCrash = true; }
      if ((uA === 'rearWheel' && isRideSurface(uB)) || (uB === 'rearWheel' && isRideSurface(uA))) { rearContacts++; spawnDust(rearWheel.getPosition(), CONFIG.visuals.dustLandingRear, 2.5); }
      if ((uA === 'frontWheel' && isRideSurface(uB)) || (uB === 'frontWheel' && isRideSurface(uA))) { frontContacts++; spawnDust(frontWheel.getPosition(), CONFIG.visuals.dustLandingFront, 2.0); }

      const bPad = bounceByFixture.get(fA) || bounceByFixture.get(fB), bOther = bounceByFixture.has(fA) ? uB : uA;
      if (bPad && isBikePart(bOther) && simTime - bPad.lastHit > 0.25 && !crashed && !finished) pendingBounce = bPad;

      const bst = boostByFixture.get(fA) || boostByFixture.get(fB), bstOther = boostByFixture.has(fA) ? uB : uA;
      if (bst && (bstOther === 'rearWheel' || bstOther === 'frontWheel')) activeBoostCounts.set(bst, (activeBoostCounts.get(bst) || 0) + 1);

      const cr = crumbleByFixture.get(fA) || crumbleByFixture.get(fB), crOther = crumbleByFixture.has(fA) ? uB : uA;
      if (cr && cr.state === 'idle' && (crOther === 'rearWheel' || crOther === 'frontWheel' || crOther === 'chassis')) { cr.state = 'shaking'; cr.timer = 0; }
    });

    world.on('end-contact', (contact) => {
      const fA = contact.getFixtureA(), fB = contact.getFixtureB();
      const uA = fA.getUserData(), uB = fB.getUserData();
      if ((uA === 'rearWheel' && isRideSurface(uB)) || (uB === 'rearWheel' && isRideSurface(uA))) rearContacts = Math.max(0, rearContacts - 1);
      if ((uA === 'frontWheel' && isRideSurface(uB)) || (uB === 'frontWheel' && isRideSurface(uA))) frontContacts = Math.max(0, frontContacts - 1);
      const bst = boostByFixture.get(fA) || boostByFixture.get(fB), bstOther = boostByFixture.has(fA) ? uB : uA;
      if (bst && (bstOther === 'rearWheel' || bstOther === 'frontWheel')) activeBoostCounts.set(bst, Math.max(0, (activeBoostCounts.get(bst) || 0) - 1));
    });
  }

  function applySuspensionLimits(wheel, restLocal, axisLocal) {
    const restWorld = chassis.getWorldPoint(restLocal), axisWorld = chassis.getWorldVector(axisLocal), wPos = wheel.getPosition();
    const travel = (wPos.x - restWorld.x) * axisWorld.x + (wPos.y - restWorld.y) * axisWorld.y;
    const cCenter = chassis.getWorldCenter(), cVel = chassis.getLinearVelocity(), cAng = chassis.getAngularVelocity();
    const rx = wPos.x - cCenter.x, ry = wPos.y - cCenter.y;
    const wVel = wheel.getLinearVelocity();
    const relVel = (wVel.x - (cVel.x - cAng * ry)) * axisWorld.x + (wVel.y - (cVel.y + cAng * rx)) * axisWorld.y;

    let forceMag = 0;
    if (travel < -CONFIG.suspension.maxExtend) {
      forceMag = Math.max(0, -(travel + CONFIG.suspension.maxExtend) * CONFIG.suspension.bumpStopStiffness - relVel * CONFIG.suspension.bumpStopDamping);
    } else if (travel > CONFIG.suspension.maxCompress) {
      forceMag = Math.min(0, -(travel - CONFIG.suspension.maxCompress) * CONFIG.suspension.bumpStopStiffness - relVel * CONFIG.suspension.bumpStopDamping);
    }
    if (forceMag !== 0) {
      const fx = axisWorld.x * forceMag, fy = axisWorld.y * forceMag;
      wheel.applyForce(pl.Vec2(fx, fy), wPos, true);
      chassis.applyForce(pl.Vec2(-fx, -fy), wPos, true);
    }
  }

  function triggerCrash() {
    if (crashed || finished) return;
    crashed = true;
    if (riderJoint) { world.destroyJoint(riderJoint); riderJoint = null; }
    riderBody.applyLinearImpulse(pl.Vec2(0, CONFIG.rider.crashImpulseY), riderBody.getWorldCenter(), true);
    spawnDust(riderBody.getPosition(), CONFIG.visuals.dustCrashCount, 5.5);
    bannerTitle.textContent = 'BAILED';
    bannerSub.textContent = '[SPACE / BKSP] CHECKPOINT (+1 FAULT)  //  [R] FULL RESTART';
    banner.classList.add('visible');
  }

  function respawnCheckpoint() {
    if (finished) { advanceAfterFinish(); return; }
    faults++; particles = []; buildWorld(activeTrack.checkpoints[currentCheckpoint]);
  }

  function resetFullRun() {
    currentCheckpoint = 0; faults = 0; runTime = 0; timerStarted = false; particles = [];
    buildWorld(activeTrack.checkpoints[0]);
    camX = activeTrack.checkpoints[0].x + CONFIG.camera.offsetX;
    camY = activeTrack.checkpoints[0].groundY + CONFIG.camera.offsetY;
  }

  function spawnDust(pos, count, speed) {
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI, s = (0.4 + Math.random() * 0.8) * speed;
      particles.push({ x: pos.x + (Math.random() - 0.5) * 0.3, y: pos.y - 0.25 + (Math.random() - 0.5) * 0.2, vx: Math.cos(a) * s - 1.5, vy: Math.sin(a) * s, life: 0.35 + Math.random() * 0.45, maxLife: 0.8, size: 0.06 + Math.random() * 0.14, rot: Math.random() * 6.28, shade: 160 + ((Math.random() * 85) | 0) });
    }
  }

  function spawnTechnicolorBurst(pos, baseHue) {
    for (let i = 0; i < CONFIG.multiplayer.crashBurstCount; i++) {
      const a = Math.random() * Math.PI * 2, s = 2.0 + Math.random() * 6.5;
      particles.push({ x: pos.x, y: pos.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s + 2.5, life: 0.45 + Math.random() * 0.55, maxLife: 1.0, size: 0.09 + Math.random() * 0.16, rot: Math.random() * 6.28, hue: (baseHue + Math.random() * 140 - 70 + 360) % 360 });
    }
  }

  // --- Physics Step ---
  let accumulator = 0, lastTime = performance.now(), lastRenderTime = lastTime, leanSmooth = 0;

  function stepPhysics(dt) {
    simTime += dt;
    if (keys.gas || keys.brake || keys.back || keys.fwd) timerStarted = true;
    if (timerStarted && !crashed && !finished) runTime += dt;

    for (const m of movers) {
      const c = m.cfg, th = simTime * c.speed + (c.phase || 0), p = m.body.getPosition();
      m.body.setLinearVelocity(pl.Vec2(((c.x + (c.ampX || 0) * Math.sin(th)) - p.x) / dt, ((c.y + (c.ampY || 0) * Math.sin(th)) - p.y) / dt));
    }

    for (const pen of pendulums) {
      const c = pen.cfg, th = c.amp * Math.sin(simTime * c.speed + (c.phase || 0)), p = pen.body.getPosition();
      pen.body.setLinearVelocity(pl.Vec2(((c.x + c.len * Math.sin(th)) - p.x) / dt, ((c.y - c.len * Math.cos(th)) - p.y) / dt));
      pen.body.setAngularVelocity((th - pen.body.getAngle()) / dt);
    }

    for (const cr of crumbles) {
      if (cr.state === 'shaking') {
        cr.timer += dt;
        if (cr.timer >= cr.delay) {
          cr.state = 'falling'; cr.vy = -4.0;
          cr.body.setAngularVelocity((Math.random() - 0.5) * 1.4);
          spawnDust({ x: cr.x, y: cr.y }, 10, 3.5);
        }
      } else if (cr.state === 'falling') {
        if (cr.body.getPosition().y > -20) {
          cr.vy = Math.max(-18, cr.vy - 18 * dt);
          cr.body.setLinearVelocity(pl.Vec2(0, cr.vy));
        } else { cr.body.setLinearVelocity(pl.Vec2(0, 0)); cr.body.setAngularVelocity(0); }
      }
    }

    for (const s of seesaws) s.body.applyTorque(-s.body.getAngle() * CONFIG.physics.seesawReturnSpring, true);
    for (const bp of bouncePads) if (bp.flash > 0) bp.flash = Math.max(0, bp.flash - dt * 3);

    if (!crashed && !finished) {
      const cVel = chassis.getLinearVelocity(), speed = cVel.length();
      if (keys.brake) {
        if (cVel.x > CONFIG.drivetrain.reverseEngageSpeed || rearWheel.getAngularVelocity() < -1.8) {
          rearJoint.setMaxMotorTorque(CONFIG.drivetrain.brakeRearTorque); rearJoint.setMotorSpeed(0);
          frontJoint.setMaxMotorTorque(CONFIG.drivetrain.brakeFrontTorque); frontJoint.setMotorSpeed(0);
        } else {
          rearJoint.setMaxMotorTorque(CONFIG.drivetrain.reverseMaxTorque); rearJoint.setMotorSpeed(CONFIG.drivetrain.reverseMotorSpeed);
          frontJoint.setMaxMotorTorque(CONFIG.drivetrain.coastFrontDrag); frontJoint.setMotorSpeed(0);
        }
      } else if (keys.gas) {
        rearJoint.setMaxMotorTorque(CONFIG.drivetrain.gasMaxTorque); rearJoint.setMotorSpeed(CONFIG.drivetrain.gasMotorSpeed);
        frontJoint.setMaxMotorTorque(CONFIG.drivetrain.frontFreewheelDrag); frontJoint.setMotorSpeed(0);
        if (rearContacts > 0 && Math.random() < CONFIG.visuals.dustGasChance) spawnDust({ x: rearWheel.getPosition().x - 0.2, y: rearWheel.getPosition().y }, 1, 2.2);
      } else {
        rearJoint.setMaxMotorTorque(CONFIG.drivetrain.coastRearDrag); rearJoint.setMotorSpeed(0);
        frontJoint.setMaxMotorTorque(CONFIG.drivetrain.coastFrontDrag); frontJoint.setMotorSpeed(0);
      }

      for (const [bst, count] of activeBoostCounts) {
        if (count > 0) {
          const ang = bst.angle || 0;
          chassis.applyForce(pl.Vec2(Math.cos(ang) * bst.thrust, Math.sin(ang) * bst.thrust), chassis.getWorldCenter(), true);
          rearJoint.setMaxMotorTorque(CONFIG.drivetrain.gasMaxTorque * 1.3); rearJoint.setMotorSpeed(-60);
          if (Math.random() < 0.65) spawnDust({ x: rearWheel.getPosition().x, y: rearWheel.getPosition().y }, 1, 4.0);
        }
      }

      const rawLean = (keys.back ? 1 : 0) - (keys.fwd ? 1 : 0), prevLean = leanSmooth;
      leanSmooth += (rawLean - leanSmooth) * CONFIG.handling.leanSmoothing * dt;
      if (riderJoint) {
        const err = leanSmooth * CONFIG.handling.riderTargetLeanRad - riderJoint.getJointAngle();
        riderJoint.setMotorSpeed(Math.max(-CONFIG.handling.riderJointMaxSpeed, Math.min(CONFIG.handling.riderJointMaxSpeed, err * CONFIG.handling.riderJointGain)));
      }

      const grounded = (rearContacts > 0 || frontContacts > 0);
      let pitchTorque = grounded ? CONFIG.handling.pitchTorqueGrounded : CONFIG.handling.pitchTorqueAir;
      if (keys.back && rearContacts > 0 && speed < 2.5) pitchTorque += CONFIG.handling.stationaryWheelieBoost;
      chassis.applyTorque(rawLean !== 0 ? rawLean * pitchTorque : -chassis.getAngularVelocity() * CONFIG.handling.neutralAngularDamping, true);

      if (grounded && Math.abs(rawLean - prevLean) > CONFIG.handling.pumpSensitivity) {
        chassis.applyLinearImpulse(pl.Vec2(0, CONFIG.handling.pumpImpulseY), chassis.getWorldCenter(), true);
      }

      if (keys.back && frontContacts > 0 && speed < CONFIG.handling.unpinchSpeedThreshold) {
        unpinchTimer += dt;
        if (unpinchTimer >= CONFIG.handling.unpinchDelay) {
          const fwPos = frontWheel.getPosition(), pullDir = keys.gas ? 1 : -1;
          frontWheel.applyForce(pl.Vec2(pullDir * CONFIG.handling.unpinchPullForce, CONFIG.handling.unpinchLiftForce), fwPos, true);
          chassis.applyForce(pl.Vec2(pullDir * CONFIG.handling.unpinchPullForce * 0.4, CONFIG.handling.unpinchLiftForce * 0.4), fwPos, true);
        }
      } else { unpinchTimer = 0; }

      applySuspensionLimits(rearWheel, rearRestLocal, rearAxisUnit);
      applySuspensionLimits(frontWheel, frontRestLocal, frontAxisUnit);

      if (chassis.getPosition().y < CONFIG.physics.killFloorY) pendingCrash = true;

      const bx = chassis.getPosition().x;
      for (let i = currentCheckpoint + 1; i < activeTrack.checkpoints.length; i++) {
        if (bx >= activeTrack.checkpoints[i].x) currentCheckpoint = i;
      }
      if (bx >= activeTrack.finishX) {
        finished = true;
        const isLast = currentTrackIdx === TRACKS.length - 1;
        bannerTitle.textContent = isLast ? 'ALL TRACKS CLEARED' : 'TRACK CLEARED';
        bannerSub.textContent = isLast
          ? `TIME ${formatTime(runTime)}  //  FAULTS ${faults}  //  [SPACE / BKSP / ENTER] BACK TO 01  //  [R] RETRY`
          : `TIME ${formatTime(runTime)}  //  FAULTS ${faults}  //  [SPACE / BKSP / ENTER] NEXT TRACK  //  [R] RETRY`;
        banner.classList.add('visible');
      }
    }

    world.step(dt, CONFIG.physics.velocityIterations, CONFIG.physics.positionIterations);

    if (pendingBounce && !crashed && !finished) {
      const pad = pendingBounce; pendingBounce = null; pad.lastHit = simTime; pad.flash = 1.0;
      for (const body of [chassis, rearWheel, frontWheel, riderBody]) {
        const v = body.getLinearVelocity();
        body.setLinearVelocity(pl.Vec2(v.x * 0.65 + pad.ix, Math.max(0, v.y * 0.15) + pad.iy));
      }
      spawnDust({ x: pad.x, y: pad.y + 0.3 }, 14, 5.5);
    }

    if (pendingCrash) { pendingCrash = false; triggerCrash(); }

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx * dt; p.y += p.vy * dt; p.vy -= CONFIG.visuals.dustGravity * dt; p.life -= dt;
      if (p.life <= 0) particles.splice(i, 1);
    }
  }

  function solveIK(ax, ay, bx, by, L1, L2, flipSign) {
    const dx = bx - ax, dy = by - ay, d = Math.min(Math.max(Math.hypot(dx, dy), 0.001), (L1 + L2) * 0.995);
    const baseAngle = Math.atan2(dy, dx), cosA = (L1 * L1 + d * d - L2 * L2) / (2 * L1 * d);
    const bend = Math.acos(Math.max(-1, Math.min(1, cosA))) * flipSign;
    return { x: ax + Math.cos(baseAngle + bend) * L1, y: ay + Math.sin(baseAngle + bend) * L1 };
  }

  function localToWorld(px, py, ang, lx, ly) {
    const c = Math.cos(ang), s = Math.sin(ang);
    return { x: px + lx * c - ly * s, y: py + lx * s + ly * c };
  }

  function lerpAngle(a, b, t) {
    let diff = (b - a) % (Math.PI * 2);
    if (diff > Math.PI) diff -= Math.PI * 2;
    if (diff < -Math.PI) diff += Math.PI * 2;
    return a + diff * t;
  }

  // --- Renderer ---
  function render(now) {
    const renderDt = Math.min((now - lastRenderTime) / 1000, 0.05);
    lastRenderTime = now;
    const P = CONFIG.palette, C = CONFIG.camera;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const bgGrad = ctx.createLinearGradient(0, 0, 0, viewH);
    bgGrad.addColorStop(0, P.skyTop); bgGrad.addColorStop(0.6, P.skyMid); bgGrad.addColorStop(1, P.skyBottom);
    ctx.fillStyle = bgGrad; ctx.fillRect(0, 0, viewW, viewH);

    const pos = chassis.getPosition(), vel = chassis.getLinearVelocity(), speed = vel.length();
    const targetZoom = Math.max(C.minZoom, Math.min(C.maxZoom, C.baseZoom - speed * C.speedZoomOut));
    camZoom += (targetZoom - camZoom) * C.zoomLerp;
    camX += (pos.x + vel.x * C.lookAheadX + C.offsetX - camX) * C.lerpX;
    camY += (pos.y + vel.y * C.lookAheadY + C.offsetY - camY) * C.lerpY;

    drawSkyline();

    ctx.save();
    ctx.translate(viewW * C.screenAnchorX, viewH * C.screenAnchorY);
    ctx.scale(camZoom, -camZoom);
    ctx.translate(-camX, -camY);

    drawObstacles();
    drawTrack();
    drawHazards();
    drawDynamicObstacles();
    drawCheckpointsAndFinish();
    drawGhosts(now, renderDt);
    drawParticles();
    drawBikeAndRider();

    ctx.restore();

    if (grainPattern) { ctx.fillStyle = grainPattern; ctx.fillRect(0, 0, viewW, viewH); }
    uiTime.textContent = formatTime(runTime);
    uiFaults.textContent = faults;
    uiSpeed.textContent = Math.round(speed * 3.6);
  }

  function drawGhosts(now, dt) {
    const M = CONFIG.multiplayer, alphaLerp = 1 - Math.exp(-M.interpSpeed * dt);
    for (const [id, g] of ghosts) {
      if (now - g.lastSeen > M.ghostTimeoutMs) { ghosts.delete(id); continue; }
      if (g.trackIdx !== currentTrackIdx) continue;

      for (let i = 0; i < 12; i++) {
        g.cur[i] = (i === 2 || i === 5 || i === 8 || i === 11) ? lerpAngle(g.cur[i], g.target[i], alphaLerp) : g.cur[i] + (g.target[i] - g.cur[i]) * alphaLerp;
      }

      const cx = g.cur[0], cy = g.cur[1], ca = g.cur[2];
      const rwx = g.cur[3], rwy = g.cur[4], rwa = g.cur[5];
      const fwx = g.cur[6], fwy = g.cur[7], fwa = g.cur[8];
      const rdx = g.cur[9], rdy = g.cur[10], rda = g.cur[11];
      const headPos = localToWorld(rdx, rdy, rda, 0.07, 0.48);

      const lastNode = g.trail[g.trail.length - 1];
      if (!lastNode || Math.hypot(cx - lastNode.cx, cy - lastNode.cy) >= M.trailSampleDist) {
        g.trail.push({ rwx, rwy, fwx, fwy, hx: headPos.x, hy: headPos.y, cx, cy });
        if (g.trail.length > M.trailLength) g.trail.shift();
      }

      if (g.trail.length > 1) {
        ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.lineCap = 'round';
        const ribbons = [
          { kx: 'hx', ky: 'hy', hueShift: 0, wMul: 1.1 },
          { kx: 'fwx', ky: 'fwy', hueShift: M.chromaticShiftDeg, wMul: 0.9 },
          { kx: 'rwx', ky: 'rwy', hueShift: -M.chromaticShiftDeg, wMul: 0.9 }
        ];
        for (const r of ribbons) {
          for (let i = 1; i < g.trail.length; i++) {
            const p0 = g.trail[i - 1], p1 = g.trail[i], t = i / g.trail.length;
            const segHue = (g.hue + r.hueShift + i * 4 + 360) % 360;
            ctx.strokeStyle = `hsla(${segHue}, 100%, 60%, ${t * 0.20})`;
            ctx.lineWidth = M.tracerWidth * 2.1 * t * r.wMul;
            ctx.beginPath(); ctx.moveTo(p0[r.kx], p0[r.ky]); ctx.lineTo(p1[r.kx], p1[r.ky]); ctx.stroke();
            ctx.strokeStyle = `hsla(${segHue}, 100%, 76%, ${t * 0.72})`;
            ctx.lineWidth = M.tracerWidth * 0.55 * t * r.wMul;
            ctx.beginPath(); ctx.moveTo(p0[r.kx], p0[r.ky]); ctx.lineTo(p1[r.kx], p1[r.ky]); ctx.stroke();
          }
        }
        ctx.restore();
      }

      const fillCol = `hsla(${g.hue}, 100%, 58%, ${M.ghostFillAlpha})`;
      const strokeCol = `hsla(${g.hue}, 100%, 75%, ${M.ghostStrokeAlpha})`;
      const accentCol = `hsla(${(g.hue + 45) % 360}, 100%, 72%, 0.85)`;
      const rad = CONFIG.bike.wheelRadius;

      for (const [wx, wy, wa] of [[rwx, rwy, rwa], [fwx, fwy, fwa]]) {
        ctx.save(); ctx.translate(wx, wy); ctx.rotate(wa);
        ctx.fillStyle = fillCol; ctx.beginPath(); ctx.arc(0, 0, rad, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = strokeCol; ctx.lineWidth = 0.055;
        ctx.beginPath(); ctx.arc(0, 0, rad * 0.88, 0, Math.PI * 2); ctx.stroke();
        ctx.beginPath();
        for (let i = 0; i < 3; i++) {
          const a = (i / 3) * Math.PI;
          ctx.moveTo(Math.cos(a) * -rad * 0.72, Math.sin(a) * -rad * 0.72);
          ctx.lineTo(Math.cos(a) * rad * 0.72, Math.sin(a) * rad * 0.72);
        }
        ctx.stroke(); ctx.restore();
      }

      const pivotRear = localToWorld(cx, cy, ca, -0.32, -0.02), forkCrown = localToWorld(cx, cy, ca, 0.56, 0.34);
      ctx.strokeStyle = strokeCol; ctx.lineWidth = 0.075;
      ctx.beginPath(); ctx.moveTo(pivotRear.x, pivotRear.y); ctx.lineTo(rwx, rwy); ctx.moveTo(forkCrown.x, forkCrown.y); ctx.lineTo(fwx, fwy); ctx.stroke();

      ctx.save(); ctx.translate(cx, cy); ctx.rotate(ca);
      ctx.fillStyle = fillCol; ctx.strokeStyle = strokeCol; ctx.lineWidth = 0.04;
      ctx.beginPath(); ctx.moveTo(-0.88, 0.28); ctx.lineTo(-0.25, 0.26); ctx.lineTo(0.18, 0.36); ctx.lineTo(0.58, 0.44); ctx.lineTo(0.95, 0.22); ctx.lineTo(0.56, 0.30); ctx.lineTo(0.15, 0.22); ctx.lineTo(-0.40, 0.14); ctx.closePath();
      ctx.fill(); ctx.stroke(); ctx.restore();

      const footPeg = localToWorld(cx, cy, ca, -0.18, -0.02), grip = localToWorld(cx, cy, ca, 0.40, 0.57);
      const hip = localToWorld(rdx, rdy, rda, -0.04, -0.34), shoulder = localToWorld(rdx, rdy, rda, 0.06, 0.24);
      const knee = solveIK(hip.x, hip.y, footPeg.x, footPeg.y, 0.38, 0.38, -1);
      const elbow = solveIK(shoulder.x, shoulder.y, grip.x, grip.y, 0.32, 0.32, 1);

      ctx.strokeStyle = strokeCol; ctx.lineWidth = 0.11;
      ctx.beginPath(); ctx.moveTo(hip.x, hip.y); ctx.lineTo(knee.x, knee.y); ctx.lineTo(footPeg.x, footPeg.y); ctx.stroke();

      ctx.save(); ctx.translate(rdx, rdy); ctx.rotate(rda);
      ctx.fillStyle = fillCol; ctx.strokeStyle = strokeCol; ctx.lineWidth = 0.04;
      ctx.beginPath(); ctx.moveTo(-0.14, -0.36); ctx.lineTo(0.12, -0.36); ctx.lineTo(0.18, 0.28); ctx.lineTo(-0.14, 0.28); ctx.closePath();
      ctx.fill(); ctx.stroke(); ctx.restore();

      ctx.strokeStyle = accentCol; ctx.lineWidth = 0.085;
      ctx.beginPath(); ctx.moveTo(shoulder.x, shoulder.y); ctx.lineTo(elbow.x, elbow.y); ctx.lineTo(grip.x, grip.y); ctx.stroke();

      ctx.save(); ctx.translate(headPos.x, headPos.y); ctx.rotate(rda);
      ctx.fillStyle = fillCol; ctx.strokeStyle = strokeCol; ctx.lineWidth = 0.045;
      ctx.beginPath(); ctx.arc(0, 0, 0.21, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = accentCol;
      ctx.beginPath(); ctx.moveTo(0.02, 0.14); ctx.lineTo(0.30, 0.11); ctx.lineTo(0.18, 0.20); ctx.closePath(); ctx.fill();
      ctx.restore();
    }
  }

  function drawSkyline() {
    const P = CONFIG.palette;
    for (let layer = 0; layer < 2; layer++) {
      const parallax = layer === 0 ? 0.18 : 0.42, baseY = viewH * (layer === 0 ? 0.78 : 0.86);
      const fill = layer === 0 ? P.skylineFarFill : P.skylineMidFill, edge = layer === 0 ? P.skylineFarEdge : P.skylineMidEdge;
      for (const b of SKYLINE) {
        if (b.layer !== layer) continue;
        const sx = (b.x - camX * parallax) * (layer === 0 ? 10 : 16) + viewW * 0.5;
        const w = b.w * (layer === 0 ? 11 : 16), h = b.h * (layer === 0 ? 11 : 16);
        if (sx + w < -60 || sx > viewW + 60) continue;
        ctx.fillStyle = fill;
        ctx.beginPath(); ctx.moveTo(sx, viewH); ctx.lineTo(sx, baseY - h); ctx.lineTo(sx + w, baseY - h + b.slant * 14); ctx.lineTo(sx + w, viewH); ctx.closePath(); ctx.fill();
        ctx.strokeStyle = edge; ctx.lineWidth = 1.2;
        ctx.beginPath(); ctx.moveTo(sx, baseY - h); ctx.lineTo(sx + w, baseY - h + b.slant * 14); ctx.stroke();
        if (layer === 1 && b.hasTag) {
          ctx.save(); ctx.translate(sx + w * 0.25, baseY - h * 0.55); ctx.rotate(-0.18);
          ctx.fillStyle = 'rgba(240, 240, 245, 0.07)'; ctx.fillRect(0, 0, w * 0.55, 6); ctx.fillRect(8, 12, w * 0.35, 3); ctx.restore();
        }
        if (layer === 1 && b.hasTruss) {
          ctx.strokeStyle = 'rgba(255,255,255,0.04)'; ctx.lineWidth = 1; ctx.beginPath();
          for (let y = baseY - h + 20; y < viewH; y += 34) { ctx.moveTo(sx + 6, y); ctx.lineTo(sx + w - 6, y + 26); }
          ctx.stroke();
        }
      }
    }
  }

  function drawTrack() {
    const P = CONFIG.palette, verts = activeTrack.verts, maxTrackX = verts[verts.length - 1][0] + 20;
    ctx.fillStyle = P.trackFill;
    ctx.beginPath(); ctx.moveTo(verts[0][0], -45);
    for (const [x, y] of verts) ctx.lineTo(x, y);
    ctx.lineTo(verts[verts.length - 1][0], -45); ctx.closePath(); ctx.fill();

    ctx.save(); ctx.clip();
    ctx.strokeStyle = P.trackHatch; ctx.lineWidth = 0.08; ctx.beginPath();
    for (let x = -25; x < maxTrackX; x += 2.2) { ctx.moveTo(x, -30); ctx.lineTo(x + 14, 18); }
    ctx.stroke();

    for (const tag of activeTrack.tags) {
      ctx.save(); ctx.translate(tag.x, tag.y); ctx.scale(1, -1); ctx.rotate(-tag.rot);
      const grad = ctx.createRadialGradient(0, 0, 0.1, 0, 0, 2.5 * tag.scale);
      grad.addColorStop(0, 'rgba(245,245,250,0.14)'); grad.addColorStop(1, 'rgba(245,245,250,0)');
      ctx.fillStyle = grad; ctx.fillRect(-3 * tag.scale, -2 * tag.scale, 6 * tag.scale, 4 * tag.scale);
      ctx.font = `900 ${1.15 * tag.scale}px Impact, Arial Narrow, sans-serif`;
      ctx.fillStyle = 'rgba(235, 235, 240, 0.24)'; ctx.fillText(tag.text, -1.6 * tag.scale, 0.4 * tag.scale);
      ctx.restore();
    }
    ctx.restore();

    ctx.strokeStyle = P.trackBevel; ctx.lineWidth = 0.28; ctx.lineCap = 'butt'; ctx.beginPath();
    verts.forEach(([x, y], i) => i ? ctx.lineTo(x, y - 0.14) : ctx.moveTo(x, y - 0.14)); ctx.stroke();
    ctx.strokeStyle = P.trackRim; ctx.lineWidth = 0.065; ctx.beginPath();
    verts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.stroke();
  }

  function drawHazards() {
    for (const hz of (activeTrack.hazards || [])) {
      ctx.save();
      ctx.fillStyle = '#202026'; ctx.fillRect(hz.x0, hz.y, hz.x1 - hz.x0, 0.14);
      ctx.fillStyle = '#e5e5ec'; ctx.beginPath();
      for (let x = hz.x0; x < hz.x1 - 0.1; x += 0.65) {
        const sw = Math.min(0.65, hz.x1 - x);
        ctx.moveTo(x, hz.y + 0.10); ctx.lineTo(x + sw * 0.5, hz.y + 0.55); ctx.lineTo(x + sw, hz.y + 0.10);
      }
      ctx.closePath(); ctx.fill(); ctx.restore();
    }
  }

  function drawObstacles() {
    const P = CONFIG.palette;
    for (const ob of activeTrack.obstacles) {
      if (ob.type !== 'pipe' && ob.type !== 'box') continue;
      ctx.save(); ctx.translate(ob.x, ob.y); ctx.rotate(ob.angle || 0);
      if (ob.type === 'pipe') {
        ctx.fillStyle = P.pipeOuter; ctx.beginPath(); ctx.arc(0, 0, ob.r, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = P.pipeMid;   ctx.beginPath(); ctx.arc(0, 0, ob.r * 0.72, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = P.pipeCore;  ctx.beginPath(); ctx.arc(0, 0, ob.r * 0.42, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = P.pipeRim; ctx.lineWidth = 0.055;
        ctx.beginPath(); ctx.arc(0, 0, ob.r - 0.02, 0.35, Math.PI - 0.35); ctx.stroke();
      } else {
        ctx.fillStyle = P.pipeOuter; ctx.fillRect(-ob.w / 2, -ob.h / 2, ob.w, ob.h);
        ctx.fillStyle = P.pipeRim;   ctx.fillRect(-ob.w / 2, ob.h / 2 - 0.06, ob.w, 0.06);
      }
      ctx.restore();
    }
  }

  function drawDynamicObstacles() {
    for (const b of boostPads) {
      ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.angle || 0);
      ctx.fillStyle = '#18181d'; ctx.fillRect(-b.w / 2, -b.h / 2, b.w, b.h);
      ctx.fillStyle = '#f2f2f5'; ctx.fillRect(-b.w / 2, b.h / 2 - 0.04, b.w, 0.04);
      const scroll = (simTime * 5) % 1.2;
      ctx.strokeStyle = '#f2f2f5'; ctx.lineWidth = 0.07; ctx.beginPath();
      for (let x = -b.w / 2 + 0.4 + scroll; x < b.w / 2 - 0.4; x += 1.2) {
        ctx.moveTo(x - 0.25, 0.14); ctx.lineTo(x + 0.10, 0.32); ctx.lineTo(x - 0.25, 0.50);
      }
      ctx.stroke(); ctx.restore();
    }

    for (const bp of bouncePads) {
      ctx.save(); ctx.translate(bp.x, bp.y); ctx.rotate(bp.angle || 0);
      const lift = bp.flash * 0.22;
      ctx.fillStyle = '#24242a'; ctx.fillRect(-bp.w / 2, -bp.h / 2, bp.w, bp.h);
      ctx.strokeStyle = '#8b8b94'; ctx.lineWidth = 0.06; ctx.beginPath();
      ctx.moveTo(-bp.w * 0.32, 0); ctx.lineTo(-bp.w * 0.32, 0.12 + lift);
      ctx.moveTo( bp.w * 0.32, 0); ctx.lineTo( bp.w * 0.32, 0.12 + lift);
      ctx.stroke();
      ctx.fillStyle = bp.flash > 0.1 ? '#ffffff' : '#d8d8e0';
      ctx.fillRect(-bp.w / 2, bp.h / 2 + lift - 0.02, bp.w, 0.10); ctx.restore();
    }

    for (const cr of crumbles) {
      const p = cr.body.getPosition();
      const sx = cr.state === 'shaking' ? Math.sin(cr.timer * 80) * 0.05 : 0;
      const sy = cr.state === 'shaking' ? Math.cos(cr.timer * 65) * 0.03 : 0;
      ctx.save(); ctx.translate(p.x + sx, p.y + sy); ctx.rotate(cr.body.getAngle());
      ctx.fillStyle = cr.state === 'shaking' ? '#2c2c35' : '#1b1b21';
      ctx.fillRect(-cr.w / 2, -cr.h / 2, cr.w, cr.h);
      ctx.strokeStyle = cr.state === 'shaking' ? '#ffffff' : '#787882'; ctx.lineWidth = 0.045;
      ctx.beginPath();
      ctx.moveTo(-cr.w * 0.35, cr.h * 0.4); ctx.lineTo(-cr.w * 0.18, 0); ctx.lineTo(-cr.w * 0.25, -cr.h * 0.45);
      ctx.moveTo(cr.w * 0.1, cr.h * 0.4); ctx.lineTo(cr.w * 0.02, -0.04); ctx.lineTo(cr.w * 0.18, -cr.h * 0.45);
      ctx.stroke();
      ctx.fillStyle = cr.state === 'shaking' ? '#ffffff' : '#c8c8d2';
      ctx.fillRect(-cr.w / 2, cr.h / 2 - 0.06, cr.w, 0.06); ctx.restore();
    }

    for (const m of movers) {
      const c = m.cfg, p = m.body.getPosition();
      ctx.strokeStyle = 'rgba(235, 235, 240, 0.14)'; ctx.lineWidth = 0.05; ctx.setLineDash([0.25, 0.25]);
      ctx.beginPath(); ctx.moveTo(c.x - (c.ampX || 0), c.y - (c.ampY || 0)); ctx.lineTo(c.x + (c.ampX || 0), c.y + (c.ampY || 0)); ctx.stroke();
      ctx.setLineDash([]);
      ctx.save(); ctx.translate(p.x, p.y);
      ctx.fillStyle = '#18181d'; ctx.fillRect(-c.w / 2, -c.h / 2, c.w, c.h);
      ctx.strokeStyle = '#484852'; ctx.lineWidth = 0.05; ctx.beginPath();
      for (let x = -c.w / 2 + 0.2; x < c.w / 2 - 0.5; x += 0.9) { ctx.moveTo(x, -c.h / 2 + 0.05); ctx.lineTo(x + 0.5, c.h / 2 - 0.08); }
      ctx.stroke();
      ctx.fillStyle = '#ededf2'; ctx.fillRect(-c.w / 2, c.h / 2 - 0.07, c.w, 0.07); ctx.restore();
    }

    for (const pen of pendulums) {
      const c = pen.cfg, p = pen.body.getPosition();
      ctx.strokeStyle = '#75757e'; ctx.lineWidth = 0.06;
      ctx.beginPath(); ctx.moveTo(c.x, c.y); ctx.lineTo(p.x, p.y); ctx.stroke();
      ctx.fillStyle = '#d8d8e0'; ctx.beginPath(); ctx.arc(c.x, c.y, 0.16, 0, Math.PI * 2); ctx.fill();
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(pen.body.getAngle());
      ctx.fillStyle = '#151519'; ctx.beginPath(); ctx.arc(0, 0, c.r, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#f2f2f5'; ctx.lineWidth = 0.06; ctx.beginPath(); ctx.arc(0, 0, c.r - 0.03, 0, Math.PI * 2); ctx.stroke();
      ctx.strokeStyle = '#6f6f78'; ctx.lineWidth = 0.05; ctx.beginPath();
      ctx.moveTo(-c.r * 0.5, 0); ctx.lineTo(c.r * 0.5, 0); ctx.moveTo(0, -c.r * 0.5); ctx.lineTo(0, c.r * 0.5);
      ctx.stroke(); ctx.restore();
    }

    for (const s of seesaws) {
      const p = s.body.getPosition();
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(s.body.getAngle());
      ctx.fillStyle = '#1d1d22'; ctx.fillRect(-s.w / 2, -s.h / 2, s.w, s.h);
      ctx.fillStyle = '#ededf2'; ctx.fillRect(-s.w / 2, s.h / 2 - 0.07, s.w, 0.07); ctx.restore();
      ctx.fillStyle = '#09090b'; ctx.beginPath(); ctx.arc(s.x, s.y, 0.26, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#f2f2f5'; ctx.lineWidth = 0.06; ctx.beginPath(); ctx.arc(s.x, s.y, 0.26, 0, Math.PI * 2); ctx.stroke();
    }

    for (const sp of spinners) {
      const p = sp.body.getPosition();
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(sp.body.getAngle());
      ctx.fillStyle = '#24242a'; ctx.fillRect(-sp.r, -0.20, sp.r * 2, 0.40); ctx.fillRect(-0.20, -sp.r, 0.40, sp.r * 2);
      ctx.strokeStyle = '#e5e5ec'; ctx.lineWidth = 0.05; ctx.strokeRect(-sp.r, -0.20, sp.r * 2, 0.40); ctx.strokeRect(-0.20, -sp.r, 0.40, sp.r * 2);
      ctx.fillStyle = '#09090b'; ctx.beginPath(); ctx.arc(0, 0, 0.34, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); ctx.restore();
    }

    for (const cr of crates) {
      const p = cr.body.getPosition();
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(cr.body.getAngle());
      ctx.fillStyle = '#222228'; ctx.fillRect(-cr.w / 2, -cr.h / 2, cr.w, cr.h);
      ctx.strokeStyle = '#9a9aa4'; ctx.lineWidth = 0.045;
      ctx.strokeRect(-cr.w / 2 + 0.02, -cr.h / 2 + 0.02, cr.w - 0.04, cr.h - 0.04);
      ctx.beginPath();
      ctx.moveTo(-cr.w / 2 + 0.06, -cr.h / 2 + 0.06); ctx.lineTo(cr.w / 2 - 0.06, cr.h / 2 - 0.06);
      ctx.moveTo(cr.w / 2 - 0.06, -cr.h / 2 + 0.06); ctx.lineTo(-cr.w / 2 + 0.06, cr.h / 2 - 0.06);
      ctx.stroke(); ctx.restore();
    }

    for (const dr of drums) {
      const p = dr.body.getPosition();
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(dr.body.getAngle());
      ctx.fillStyle = '#1b1b21'; ctx.beginPath(); ctx.arc(0, 0, dr.r, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#dcdce4'; ctx.lineWidth = 0.05; ctx.beginPath(); ctx.arc(0, 0, dr.r - 0.025, 0, Math.PI * 2); ctx.stroke();
      ctx.strokeStyle = '#6f6f78'; ctx.lineWidth = 0.04; ctx.beginPath();
      ctx.moveTo(-dr.r * 0.65, 0); ctx.lineTo(dr.r * 0.65, 0); ctx.moveTo(0, -dr.r * 0.65); ctx.lineTo(0, dr.r * 0.65);
      ctx.stroke(); ctx.restore();
    }
  }

  function drawCheckpointsAndFinish() {
    activeTrack.checkpoints.forEach((cp, idx) => {
      if (idx === 0) return;
      ctx.save(); ctx.translate(cp.x, cp.groundY);
      ctx.fillStyle = idx <= currentCheckpoint ? '#f2f2f5' : '#42424a';
      ctx.fillRect(-0.04, 0, 0.08, 2.8);
      ctx.beginPath(); ctx.moveTo(0.04, 2.8); ctx.lineTo(1.1, 2.45); ctx.lineTo(0.04, 2.1); ctx.closePath(); ctx.fill();
      ctx.restore();
    });
    ctx.save(); ctx.translate(activeTrack.finishX, activeTrack.finishY);
    ctx.fillStyle = '#f2f2f5'; ctx.fillRect(-0.08, 0, 0.16, 4.4); ctx.fillRect(-0.35, 3.6, 0.7, 0.8);
    ctx.scale(1, -1); ctx.font = '900 0.55px Impact, sans-serif'; ctx.fillStyle = '#070708'; ctx.fillText('FIN', -0.28, -3.78);
    ctx.restore();
  }

  function drawParticles() {
    for (const p of particles) {
      const a = Math.max(0, p.life / p.maxLife);
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.fillStyle = p.hue !== undefined ? `hsla(${p.hue}, 100%, 65%, ${a * 0.9})` : `rgba(${p.shade},${p.shade},${p.shade},${a * 0.75})`;
      ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.65);
      ctx.restore();
    }
  }

  function drawWheel(body) {
    const P = CONFIG.palette, r = CONFIG.bike.wheelRadius, p = body.getPosition();
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(body.getAngle());
    ctx.fillStyle = P.tire; ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = P.tread;
    for (let i = 0; i < 12; i++) { ctx.save(); ctx.rotate((i / 12) * Math.PI * 2); ctx.fillRect(r - 0.04, -0.04, 0.05, 0.08); ctx.restore(); }
    ctx.strokeStyle = P.rim; ctx.lineWidth = 0.045; ctx.beginPath(); ctx.arc(0, 0, r * 0.65, 0, Math.PI * 2); ctx.stroke();
    ctx.strokeStyle = P.spokes; ctx.lineWidth = 0.025; ctx.beginPath();
    for (let i = 0; i < 6; i++) {
      const a = (i / 6) * Math.PI;
      ctx.moveTo(Math.cos(a) * -(r * 0.63), Math.sin(a) * -(r * 0.63));
      ctx.lineTo(Math.cos(a) * (r * 0.63), Math.sin(a) * (r * 0.63));
    }
    ctx.stroke();
    ctx.fillStyle = P.rotor; ctx.beginPath(); ctx.arc(0, 0, r * 0.25, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  function drawBikeAndRider() {
    const P = CONFIG.palette;
    drawWheel(rearWheel); drawWheel(frontWheel);
    const rw = rearWheel.getPosition(), fw = frontWheel.getPosition();
    const pivotRear = chassis.getWorldPoint(pl.Vec2(-0.32, -0.02)), forkCrown = chassis.getWorldPoint(pl.Vec2(0.56, 0.34));

    ctx.strokeStyle = P.swingarm; ctx.lineWidth = 0.085; ctx.lineCap = 'butt';
    ctx.beginPath(); ctx.moveTo(pivotRear.x, pivotRear.y); ctx.lineTo(rw.x, rw.y); ctx.stroke();
    ctx.strokeStyle = P.forkStanchion; ctx.lineWidth = 0.075;
    ctx.beginPath(); ctx.moveTo(forkCrown.x, forkCrown.y); ctx.lineTo(fw.x, fw.y); ctx.stroke();
    ctx.strokeStyle = P.forkSlider; ctx.lineWidth = 0.105;
    ctx.beginPath(); ctx.moveTo(forkCrown.x, forkCrown.y); ctx.lineTo(forkCrown.x + (fw.x - forkCrown.x) * 0.55, forkCrown.y + (fw.y - forkCrown.y) * 0.55); ctx.stroke();

    const cp = chassis.getPosition();
    ctx.save(); ctx.translate(cp.x, cp.y); ctx.rotate(chassis.getAngle());
    ctx.fillStyle = P.engine; ctx.beginPath(); ctx.moveTo(-0.38, -0.06); ctx.lineTo(0.32, -0.05); ctx.lineTo(0.28, 0.22); ctx.lineTo(-0.30, 0.20); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = P.exhaust; ctx.lineWidth = 0.06; ctx.beginPath(); ctx.moveTo(0.18, 0.05); ctx.lineTo(-0.22, 0.02); ctx.lineTo(-0.82, 0.24); ctx.stroke();
    ctx.fillStyle = P.fairing; ctx.beginPath(); ctx.moveTo(-0.88, 0.28); ctx.lineTo(-0.25, 0.26); ctx.lineTo(0.18, 0.36); ctx.lineTo(0.58, 0.44); ctx.lineTo(0.95, 0.22); ctx.lineTo(0.56, 0.30); ctx.lineTo(0.15, 0.22); ctx.lineTo(-0.40, 0.14); ctx.closePath(); ctx.fill();
    ctx.fillStyle = P.seat; ctx.beginPath(); ctx.moveTo(-0.55, 0.27); ctx.lineTo(0.08, 0.34); ctx.lineTo(0.12, 0.27); ctx.lineTo(-0.52, 0.22); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = P.bars; ctx.lineWidth = 0.055; ctx.beginPath(); ctx.moveTo(0.52, 0.38); ctx.lineTo(0.46, 0.56); ctx.lineTo(0.38, 0.58); ctx.stroke();
    ctx.restore();

    const footPeg = chassis.getWorldPoint(pl.Vec2(-0.18, -0.02)), grip = chassis.getWorldPoint(pl.Vec2(0.40, 0.57));
    const hip = riderBody.getWorldPoint(pl.Vec2(-0.04, -0.34)), shoulder = riderBody.getWorldPoint(pl.Vec2(0.06, 0.24)), head = riderBody.getWorldPoint(pl.Vec2(0.07, 0.48));
    const knee = solveIK(hip.x, hip.y, footPeg.x, footPeg.y, 0.38, 0.38, -1), elbow = solveIK(shoulder.x, shoulder.y, grip.x, grip.y, 0.32, 0.32, 1);

    ctx.strokeStyle = P.riderLegs; ctx.lineWidth = 0.14; ctx.lineJoin = 'miter';
    ctx.beginPath(); ctx.moveTo(hip.x, hip.y); ctx.lineTo(knee.x, knee.y); ctx.lineTo(footPeg.x, footPeg.y); ctx.stroke();

    ctx.save(); ctx.translate(riderBody.getPosition().x, riderBody.getPosition().y); ctx.rotate(riderBody.getAngle());
    ctx.fillStyle = P.riderTorso; ctx.beginPath(); ctx.moveTo(-0.14, -0.36); ctx.lineTo(0.12, -0.36); ctx.lineTo(0.18, 0.28); ctx.lineTo(-0.14, 0.28); ctx.closePath(); ctx.fill();
    ctx.fillStyle = P.riderStripe; ctx.fillRect(-0.12, -0.05, 0.28, 0.12); ctx.restore();

    ctx.strokeStyle = P.riderArms; ctx.lineWidth = 0.10;
    ctx.beginPath(); ctx.moveTo(shoulder.x, shoulder.y); ctx.lineTo(elbow.x, elbow.y); ctx.lineTo(grip.x, grip.y); ctx.stroke();

    ctx.save(); ctx.translate(head.x, head.y); ctx.rotate(riderBody.getAngle());
    ctx.fillStyle = P.helmet; ctx.beginPath(); ctx.arc(0, 0, 0.21, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = P.visor; ctx.beginPath(); ctx.moveTo(0.02, 0.14); ctx.lineTo(0.30, 0.11); ctx.lineTo(0.18, 0.20); ctx.closePath(); ctx.fill();
    ctx.fillStyle = P.goggles; ctx.fillRect(0.08, -0.02, 0.14, 0.08); ctx.restore();
  }

  function formatTime(sec) {
    const mins = Math.floor(sec / 60), rem = sec % 60;
    return `${String(mins).padStart(2, '0')}:${rem.toFixed(2).padStart(5, '0')}`;
  }

  selectTrack(0);
  connectMultiplayer();

  function loop(now) {
    const frameDt = Math.min((now - lastTime) / 1000, CONFIG.physics.maxFrameDt);
    lastTime = now; accumulator += frameDt;
    while (accumulator >= CONFIG.physics.fixedDt) { stepPhysics(CONFIG.physics.fixedDt); accumulator -= CONFIG.physics.fixedDt; }
    sendLocalPose(now);
    render(now);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
